spring:
  config:
    import:
      - optional:file:${TECHGATHER_SECRET_PATH:./config/application-secret.yml}
      - optional:file:../config/application-secret.yml
      - optional:file:/config/application-secret.yml
  kafka:
    topic: ${techgather.kafka.topic:post}
    bootstrap-servers: ${techgather.kafka.bootstrap-servers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      security.protocol: ${techgather.kafka.security.protocol:SASL_PLAINTEXT}
      sasl.mechanism: ${techgather.kafka.sasl.mechanism:SCRAM-SHA-512}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${techgather.kafka.username:}" password="${techgather.kafka.password:}";

collector:
  run:
    run-on-startup: ${techgather.collector.run.run-on-startup:false}
    scheduled-enabled: ${techgather.collector.run.scheduled-enabled:true}
    cron: ${techgather.collector.run.cron:0 0 3 * * *}
    zone: ${techgather.collector.run.zone:Asia/Seoul}
  batch-job:
    enabled: ${techgather.collector.batch-job.enabled:true}
    post-ingest-url: ${techgather.collector.batch-job.post-ingest-url:http://localhost:7500/internal/jobs/post-ingest}
    token: ${techgather.internal.job-token:}
    timeout-millis: ${techgather.collector.batch-job.timeout-millis:60000}

discord:
  notification:
    enabled: ${techgather.discord.notification.enabled:false}
    post-webhook-url: ${techgather.discord.notification.post-webhook-url:}
    feedback-webhook-url: ${techgather.discord.notification.feedback-webhook-url:}
    timeout-millis: ${techgather.discord.notification.timeout-millis:5000}

