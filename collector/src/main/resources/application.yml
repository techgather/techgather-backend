spring:
  kafka:
    topic: post
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

collector:
  run:
    run-on-startup: true
    scheduled-enabled: false
    cron: "0 0 3 * * *"
    zone: "Asia/Seoul"

target:
  actives: woowahan,toss,musinsa,naver,kurly,kakao,kakao-pay,devsisters,line,coupang,daangn,zigbang,watcha,banksalad,hyperconnect,yogiyo,socar,nhn,gaeraeblog,oliveyoung,gccompany
  entries:
    woowahan:
      url: https://techblog.woowahan.com/feed
      adapter:
        crawler:
          type: htmlCrawler
        extractor:
          type: rssV2Extractor
          useDefaultThumbnail: true
          defaultThumbnail: https://techblog.woowahan.com/wp-content/uploads/2022/01/woowahan-logo.png
    toss:
      url: https://toss.tech/rss.xml
      adapter:
        crawler:
          type: htmlCrawler
        extractor:
