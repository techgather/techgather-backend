server:
  port: 5080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  profiles:
    default: dev

  cloud:
    aws:
      region:
        static: ap-northeast-2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        provider:
          cognito:
            issuer-uri: ${spring.security.oauth2.client.provider.cognito.issuer-uri}
        registration:
          cognito:
            provider: cognito
            client-id: ${COGNITO_USER_CLIENT_ID}
            client-secret: ${COGNITO_USER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/cognito"
            scope:
              - openid
              - email
              - profile
              - aws.cognito.signin.user.admin

          cognito-admin:
            provider: cognito
            client-id: ${COGNITO_USER_CLIENT_ID}
            client-secret: ${COGNITO_USER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/cognito-admin"
            scope:
              - openid
              - email
              - profile
              - aws.cognito.signin.user.admin
      resourceserver:
        jwt:
          issuer-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}

logging:
  level:
    root: INFO
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa: DEBUG

app:
  auth:
    success-redirect-url: ${AUTH_SUCCESS_REDIRECT_URL:http://localhost:3000}
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax