server:
  port: 5080
  forward-headers-strategy: framework

spring:
  profiles:
    default: dev   # 아무것도 지정하지 않으면 자동으로 dev

  cloud:
    aws:
      region:
        static: ap-northeast-2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        provider:
          cognito:
            issuer-uri: ${spring.security.oauth2.client.provider.cognito.issuer-uri}
        registration:
          cognito:
            provider: cognito
            client-id: ${COGNITO_USER_CLIENT_ID}
            client-secret: ${COGNITO_USER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/cognito"
            scope:
              - openid
              - email
              - profile

          cognito-admin:
            provider: cognito
            client-id: ${COGNITO_USER_CLIENT_ID}
            client-secret: ${COGNITO_USER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/cognito-admin"
            scope:
              - openid
              - email
              - profile

logging:
  level:
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa: DEBUG

---
spring:
  config:
    import: "aws-parameterstore:/tech-gather/local/"
  config.activate.on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/techgather?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: appuser
    password: apppass
    driver-class-name: com.mysql.cj.jdbc.Driver

---
spring:
  config:
    import: "aws-parameterstore:/tech-gather/prod/"
  config.activate.on-profile: prod

