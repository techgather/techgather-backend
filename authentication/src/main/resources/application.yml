server:
  port: 5080
  forward-headers-strategy: framework
  servlet:
    context-path: /auth

spring:
  profiles:
    default: dev   # 아무것도 지정하지 않으면 자동으로 dev

  cloud:
    aws:
      region:
        static: ap-northeast-2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          cognito:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile

---
spring:
  config:
    import: "aws-parameterstore:/tech-gather/dev/cognito/"
  config.activate.on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

aws:
  secrets:
    enabled: false
db:
  username: appuser
  password: apppass
  url: jdbc:mysql://localhost:3306/techgather?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8

logging:
  level:
    org:
      springframework:
        security=DEBUG:
---
spring:
  config:
    import: "aws-parameterstore:/tech-gather/prod/cognito/"
  config.activate.on-profile: prod

