server:
  port: 8888

spring:
  profiles:
    active: dev
  config:
    import:
      - optional:file:${TECHGATHER_SECRET_PATH:./config/application-secret.yml}
      - optional:file:../config/application-secret.yml
      - optional:file:/config/application-secret.yml
  datasource:
    url: ${techgather.datasource.url}
    username: ${techgather.datasource.username}
    password: ${techgather.datasource.password}
    driver-class-name: ${techgather.datasource.driver-class-name:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${techgather.datasource.hikari.maximum-pool-size:10}
  jpa:
    database-platform: ${techgather.jpa.database-platform:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: ${techgather.jpa.hibernate.ddl-auto:update}
    properties:
      hibernate:
        format_sql: ${techgather.jpa.hibernate.format-sql:true}
        show_sql: ${techgather.jpa.hibernate.show-sql:true}
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  api:
    app-name: Dev-Pick-BE

discord:
  notification:
    enabled: ${techgather.discord.notification.enabled:false}
    webhook-url: ${techgather.discord.notification.webhook-url:}
    post-webhook-url: ${techgather.discord.notification.post-webhook-url:${techgather.discord.notification.webhook-url:}}
    feedback-webhook-url: ${techgather.discord.notification.feedback-webhook-url:}
    timeout-millis: ${techgather.discord.notification.timeout-millis:5000}

classification:
  llm:
    enabled: ${techgather.classification.llm.enabled:false}
    base-url: ${techgather.classification.llm.base-url:https://integrate.api.nvidia.com/v1}
    api-key: ${techgather.nvidia.api-key:}
    model: ${techgather.classification.llm.model:deepseek-ai/deepseek-v4-flash}
    reasoning-effort: ${techgather.classification.llm.reasoning-effort:none}
    timeout-millis: ${techgather.classification.llm.timeout-millis:30000}
    min-interval-millis: ${techgather.classification.llm.min-interval-millis:1500}
    max-calls-per-run: ${techgather.classification.llm.max-calls-per-run:40}
