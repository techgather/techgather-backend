server:
  port: 8888

spring:
  profiles:
    active: dev

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  api:
    app-name: Dev-Pick-BE
