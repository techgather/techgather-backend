server:
  port: 8888
  servlet:
    context-path: /api

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/techgather
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: techgather
    password: techgather
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  config:
    import: "aws-parameterstore:/tech-gather/local/"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${spring.security.oauth2.client.provider.cognito.issuer-uri}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

