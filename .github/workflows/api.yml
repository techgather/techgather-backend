name: API CI/CD

on:
  push:
    branches:
      - development
      - feature/api
      - cicd
    paths:
      - "api/**"
      - "application/**"
      - "domain/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker Image
        run: |
          chmod +x ./gradlew
          ./gradlew :api:bootJar

          REGISTRY="asia-northeast3-docker.pkg.dev"
          REPOSITORY="tg-docker-registry"
          IMAGE_TAG="tg-api:latest"

          FULL_PATH=$(echo "$REGISTRY/${{ secrets.GCP_PROJECT_ID }}/$REPOSITORY/$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')

          gcloud auth configure-docker $REGISTRY --quiet

          docker build -t "$FULL_PATH" -f ./api/Dockerfile ./api
          docker push "$FULL_PATH"

      - name: Execute Remote Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SERVER_IP }}
          username: ${{ secrets.GCP_SERVER_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            echo "Starting API deployment script..."
            cd ~/app/scripts
            ./api-deploy.sh
