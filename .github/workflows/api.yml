name: API CI/CD

on:
  push:
    branches:
      - dev
      - cicd
    paths:
      - "api/**"
      - "application/**"
      - "domain/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/techgather/tg-api-dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The default-branch manual entry point deploys the active release branch.
          ref: ${{ github.ref_name == 'main' && 'dev' || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          chmod +x ./gradlew
          ./gradlew :api:bootJar

          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$IMAGE" -f ./api/Dockerfile ./api
          docker push "$IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Execute Remote Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GHCR_USERNAME,GHCR_TOKEN
          host: ${{ secrets.TG_PROD_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.TG_PROD_SERVER_SSH_KEY }}
          script: |
            echo "Starting API deployment script..."
            cd ~/app/scripts
            ./api-deploy.sh
