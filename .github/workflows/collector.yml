name: Collector CI/CD

on:
  push:
    branches:
      - dev
      - cicd
    paths:
      - "collector/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/techgather/tg-collector-dev:latest
      DOCKER_PLATFORM: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The default-branch manual entry point deploys the active release branch.
          ref: ${{ github.ref_name == 'main' && 'dev' || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        run: |
          chmod +x ./gradlew
          ./gradlew :collector:bootJar

          docker buildx build \
            --platform "${{ env.DOCKER_PLATFORM }}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE" \
            -f ./collector/Dockerfile ./collector \
            --push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Execute Remote Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GHCR_USERNAME,GHCR_TOKEN
          host: ${{ secrets.TG_PROD_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.TG_PROD_SERVER_SSH_KEY }}
          script: |
            echo "Starting Collector deployment script..."
            cd ~/app/scripts
            ./collector-deploy.sh
